services:
  - type: web
    name: roomstreaming-web
    runtime: static
    buildCommand: npm ci && npm run build -w @roomstreaming/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false

  - type: web
    name: roomstreaming-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @roomstreaming/api
    startCommand: npm run start -w @roomstreaming/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ROOM_TTL_HOURS
        value: 6
      - key: HOST_RECONNECT_GRACE_SECONDS
        value: 60
      - key: YOUTUBE_API_KEY
        sync: false
